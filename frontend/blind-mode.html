<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignSight - Blind Mode</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/blind-mode.css">
</head>
<body>
    <nav class="navbar">
    <div class="logo">Sign<span>Sight</span></div>
</nav>

    <div class="blind-container">
        <div class="blind-header">
            <h1>Blind Mode</h1>
            <p id="statusText">Tap 'Voice Command' & Ask Question</p>
        </div>

        <div class="voice-section">
            <div class="voice-indicator">
                <div class="microphone-icon" id="micIcon">🎤</div>
                <p id="voiceStatus">Say: "What is this?" or "Where am I?"</p>
            </div>

            <div class="control-grid">
                <button 
                    class="control-button tl-btn" 
                    id="startCameraBtn"
                    onfocus="speak('Start camera for detection')"
                    onclick="startCamera()"
                    aria-label="Start camera for sign detection">
                    <span class="btn-icon">📷</span>
                    <span class="btn-text">Start Camera</span>
                </button>

                <button 
                    class="control-button tr-btn" 
                    id="voiceCommandBtn"
                    onfocus="speak('Ask question button. Listen for commands.')"
                    onclick="activateVoiceAssistant()"
                    aria-label="Listen for voice commands">
                    <span class="btn-icon">🗣️</span>
                    <span class="btn-text">Ask Question</span>
                </button>

                <button 
                    class="control-button bl-btn" 
                    id="locationBtn"
                    onfocus="speak('My location button. Get GPS coordinates.')"
                    onclick="shareLocation()"
                    aria-label="Share your GPS location with trusted contacts">
                    <span class="btn-icon">📍</span>
                    <span class="btn-text">My Location</span>
                </button>

                <button 
                    class="control-button br-btn" 
                    id="readScreenBtn"
                    onfocus="speak('Read scene button. Identify surrounding objects.')"
                    onclick="readScreen()"
                    aria-label="Read current screen content">
                    <span class="btn-icon">👀</span>
                    <span class="btn-text">Read Scene</span>
                </button>
            </div>
        </div>

        <div class="text-display-section">
            <div class="text-box">
                <p id="recognizedText">Waiting for your question...</p>
            </div>
            <div class="audio-controls">
                <button 
                    class="audio-btn" 
                    id="speakBtn"
                    onfocus="speak('Repeat answer button')"
                    onclick="speakCurrentText()"
                    aria-label="Speak the recognized text">
                    🔊 Repeat Answer
                </button>
            </div>
        </div>

        <div class="camera-container" id="cameraContainer" style="display: none;">
            <video id="cameraFeed" autoplay playsinline></video>
        </div>
    </div>

    <button 
        class="sos-btn" 
        onfocus="speak('Emergency SOS. Click to call for help and log location.')"
        onclick="triggerSOS()"
        aria-label="Trigger emergency SOS">
        SOS
    </button>

    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <sript src="js/blind-mode.js"></script>
    <script src="js/translations.js"></script>
</body>
</html>
