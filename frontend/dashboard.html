<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignSight Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">

  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar collapsed" id="sidebar" aria-label="Dashboard sidebar">
      <div class="sidebar-header">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Toggle sidebar">☰</button>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-item">
          <span class="item-icon" aria-hidden="true">🔥</span>
          <div class="item-text">
            <span class="stat-title">Current Streak</span>
            <span class="stat-val" id="sidebarStreak">0 Day</span>
          </div>
        </div>

        <div class="sidebar-item">
          <span class="item-icon" aria-hidden="true">⏱️</span>
          <div class="item-text">
            <span class="stat-title">Time Spent Today</span>
            <span class="stat-val" id="timeSpent">0m</span>
          </div>
        </div>

        <div class="sidebar-item progress-card">
          <span class="item-icon" aria-hidden="true">🎯</span>
          <div class="item-text">
            <div class="progress-info">
              <span class="stat-title">Daily Goal</span>
              <span class="progress-percent" id="sidebarProgressText">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="sidebarProgressFill"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <a href="settings.html" class="settings-btn">
          <span class="item-icon" aria-hidden="true">⚙️</span>
          <span class="item-text">Settings</span>
        </a>
      </div>
    </aside>

    <div class="main-wrapper">
      <nav class="navbar">
        <div class="nav-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" type="button" aria-label="Open menu">☰</button>
          <span class="brand-name">SignSight</span>
        </div>

        <div class="profile-section" id="profile-section">
          <button class="profile-circle" id="profile-btn" type="button" aria-label="Open profile menu">
            <span id="sidebarAvatar">U</span>
          </button>
          <div class="profile-dropdown" id="dropdown-menu">
            <a href="edit-profile.html" class="dropdown-link">Edit Profile</a>
            <a href="#" class="logout-link" id="logout-btn">Log Out</a>
          </div>
        </div>
      </nav>

      <main class="content-area">
        <div class="dashboard-container">
          <h1 class="welcome-text">Welcome Back, <span id="displayName">User</span>!</h1>
          <p class="subtitle">Choose a mode to start learning and communicating.</p>

          <div class="modes-stack">
            <button class="floating-card" id="deaf-mode-card" type="button">
              <div class="card-icon">🤟</div>
              <div class="card-info">
                <h3>Deaf Mode</h3>
                <p>Practice sign language with live visual detection.</p>
              </div>
            </button>

            <button class="floating-card" id="blind-mode-card" type="button">
              <div class="card-icon">🦯</div>
              <div class="card-info">
                <h3>Blind Mode</h3>
                <p>Use object detection with voice-based guidance.</p>
              </div>
            </button>
          </div>

          <button class="sos-btn" type="button" onclick="triggerInnovativeSOS()">SOS</button>
        </div>
      </main>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/sos.js"></script>
</body>
</html>
